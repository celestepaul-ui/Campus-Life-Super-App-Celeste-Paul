<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dining</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <header>
    <!--add 3 buttons for Home, Events, and Dining, highlighting the current page as Red-->
    <div class="d-flex justify-content-center">
      <a class="btn btn-secondary m-2" href="index.html">Home</a>
      <a class="btn btn-secondary m-2" href="Events.html">Events</a>
      <a class="btn btn-danger m-2" href="Dining.html">Dining</a>
    </div>
  </header>

  <main class="container my-auto">
    <h1 class="h1 text-center my-4">The Dining Hall</h1>

    <!-- Add Example food image using API-->

    <img class="mb-4" id="dining-image" alt="Chicken Tenders, Fries, and ketchup on a plate" width="100%" />

    <!--Add table with dining hall hours-->
    <div class="table-responsive">
      <table class="table table-striped table-bordered table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th scope="col">Dining Hall</th>
            <th scope="col">Hours of Operation</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>The Dining Hall</td>
            <td>10am-11pm</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Add Menu button and static menu that pops up when buton is clicked
    add event listener for clicking the button  
    -->

  </main>

  <!--Add footer with real-time feature: today's date-->
  <footer class="bg-light d-flex py-3 mt-auto border-top">
    <div>
      <p class="mb-0">Today's Date: <span id="current-date"></span></p>
    </div>
  </footer>

  <script src="./js/script.js"></script>
</body>

</html>
